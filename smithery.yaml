# Smithery: livedot MCP is a hosted remote server. There is nothing to build or run: Smithery connects to the URL.
# Publish it on smithery.ai as an existing remote server (Streamable HTTP, no authentication, no configuration).
name: livedot MCP
description: Where someone is in a live race, the weather on the course, and race-day forecasts, with a live map.
homepage: https://livedot.me/mcp
repository: https://github.com/livedotme/mcp
license: MIT
remote:
  url: https://livedot.me/mcp
  transport: streamable-http
  authentication: none
startCommand:
  type: http
  configSchema:
    type: object
    properties: {}
